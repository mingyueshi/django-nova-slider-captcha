name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: src:.
      NOVA_TEST_DB: ${{ runner.temp }}/nova-django-${{ matrix.python }}.sqlite3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . 'Django==5.2.17'
      - run: python -m pip check
      - run: python -m django check
      - run: python -m django makemigrations nova_slider_captcha --check --dry-run
      - run: python -m django test tests --noinput -v 1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOVA_TEST_DB: ${{ runner.temp }}/nova-web.sqlite3
      NOVA_DOM_REPORT: ${{ runner.temp }}/nova-dom-results.json
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -e . 'Django==5.2.17'
      - run: npm ci
      - run: npm test
      - run: npm run test:dom
      - run: npm run test:worker
