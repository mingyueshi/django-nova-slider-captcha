name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_release.py --dist dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  django:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            django: '5.2.17'
            pillow: '12.2.0'
          - python: '3.11'
            django: '5.2.17'
            pillow: '12.3.0'
          - python: '3.12'
            django: '5.2.17'
            pillow: '12.3.0'
          - python: '3.12'
            django: '6.1.2'
            pillow: '12.2.0'
          - python: '3.13'
            django: '6.1.2'
            pillow: '12.3.0'
          - python: '3.14'
            django: '6.0.9'
            pillow: '12.3.0'
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      DJANGO_VERSION: ${{ matrix.django }}
      PILLOW_VERSION: ${{ matrix.pillow }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - run: python -m pip install -e . "Django==$DJANGO_VERSION" "Pillow==$PILLOW_VERSION"
      - run: python -m pip check
      - name: Source checks and complete tests
        env:
          PYTHONPATH: src:.
          NOVA_TEST_DB: ${{ runner.temp }}/nova-source-${{ matrix.python }}-${{ matrix.django }}-${{ matrix.pillow }}.sqlite3
        run: |
          python -m django check
          python -m django makemigrations nova_slider_captcha --check --dry-run
          python -m django test tests --noinput -v 1
      - name: Install the built wheel
        run: |
          python -m pip uninstall -y nova-slider-captcha
          python -m pip install --no-deps dist/*.whl
          python -m pip check
      - name: Wheel checks and complete tests
        env:
          PYTHONPATH: .
          NOVA_TEST_DB: ${{ runner.temp }}/nova-wheel-${{ matrix.python }}-${{ matrix.django }}-${{ matrix.pillow }}.sqlite3
        run: |
          python -c "import pathlib,nova_slider_captcha; p=pathlib.Path(nova_slider_captcha.__file__).resolve(); print(p); assert not p.is_relative_to(pathlib.Path('src').resolve())"
          python -m django check
          python -m django makemigrations nova_slider_captcha --check --dry-run
          python -m django test tests --noinput -v 1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lint.txt
      - run: ruff check .

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Initialize isolated coverage output
        run: |
          mkdir -p "$RUNNER_TEMP/nova-coverage"
          echo "NOVA_COVERAGE_DIR=$RUNNER_TEMP/nova-coverage" >> "$GITHUB_ENV"
          echo "COVERAGE_FILE=$RUNNER_TEMP/nova-coverage/.coverage" >> "$GITHUB_ENV"
          echo "NOVA_TEST_DB=$RUNNER_TEMP/nova-coverage-tests.sqlite3" >> "$GITHUB_ENV"
      - run: python -m pip install -e . 'Django==5.2.17' 'Pillow==12.3.0' -r requirements-coverage.txt
      - name: Require the source package
        run: python -c "import pathlib,nova_slider_captcha; assert pathlib.Path(nova_slider_captcha.__file__).resolve().is_relative_to(pathlib.Path('src').resolve())"
      - name: Measure full suite with branch and subprocess coverage
        run: python -m coverage run -m django test tests --noinput -v 1
      - name: Generate reports even if tests fail
        if: always()
        run: |
          python -m coverage combine --keep
          python -m coverage json --pretty-print -o "$NOVA_COVERAGE_DIR/coverage.json"
          python -m coverage html -d "$NOVA_COVERAGE_DIR/html"
          python -m coverage xml -o "$NOVA_COVERAGE_DIR/coverage.xml"
          python -m coverage report > "$NOVA_COVERAGE_DIR/summary.txt"
      - name: Check source scope and pure coverage floors
        if: always()
        run: |
          python scripts/check_coverage.py "$NOVA_COVERAGE_DIR/coverage.json" > "$NOVA_COVERAGE_DIR/gate.json"
          python scripts/test_coverage_gate.py "$NOVA_COVERAGE_DIR/coverage.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-coverage-3.12-django-5.2.17
          path: ${{ runner.temp }}/nova-coverage/
          include-hidden-files: true
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -e . 'Django==5.2.17'
      - run: npm ci
      - run: npm test
      - run: npm run test:dom
        env:
          NOVA_TEST_DB: ${{ runner.temp }}/nova-web.sqlite3
          NOVA_DOM_REPORT: ${{ runner.temp }}/nova-dom-results.json
      - run: npm run test:worker
