<!doctype html>
<html lang="zh-Hans">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录显示名称演示</title>
<main>
  <h1>登录显示名称演示</h1>
  <p>请使用由核验人员预先登记的本地演示账号。</p>
  {% if login_error %}<p role="alert">{{ login_error }}</p>{% endif %}
  {% if form.errors %}<p role="alert">无法登录，请检查账号和密码后重试。</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">登录</button>
  </form>
</main>
</html>
