[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-slider-captcha"
version = "0.2.0"
description = "Self-hosted puzzle slider CAPTCHA for Django forms and Django Admin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Django>=5.2.17,<6.2", "Pillow==12.2.0"]
license = "MIT"
classifiers = ["Development Status :: 3 - Alpha", "Framework :: Django :: 5.2", "Framework :: Django :: 6.0", "Framework :: Django :: 6.1", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nova_slider_captcha = ["templates/nova_slider_captcha/*.html", "static/nova_slider_captcha/*.css", "static/nova_slider_captcha/*.js", "locale/*/LC_MESSAGES/*.po", "locale/*/LC_MESSAGES/*.mo"]
