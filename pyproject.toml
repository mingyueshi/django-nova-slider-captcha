[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-slider-captcha"
version = "0.3.0"
description = "Self-hosted puzzle slider CAPTCHA for Django forms and Django Admin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Django>=5.2.17,<6.2", "Pillow>=12.2,<13"]
license = "MIT"
classifiers = ["Development Status :: 3 - Alpha", "Framework :: Django :: 5.2", "Framework :: Django :: 6.0", "Framework :: Django :: 6.1", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]

[project.urls]
Homepage = "https://github.com/mingyueshi/django-nova-slider-captcha"
Repository = "https://github.com/mingyueshi/django-nova-slider-captcha"
Documentation = "https://github.com/mingyueshi/django-nova-slider-captcha/blob/main/README.md"
Changelog = "https://github.com/mingyueshi/django-nova-slider-captcha/blob/main/docs/CHANGELOG.md"
Issues = "https://github.com/mingyueshi/django-nova-slider-captcha/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nova_slider_captcha = ["templates/nova_slider_captcha/*.html", "static/nova_slider_captcha/*.css", "static/nova_slider_captcha/*.js", "locale/*/LC_MESSAGES/*.po", "locale/*/LC_MESSAGES/*.mo"]
